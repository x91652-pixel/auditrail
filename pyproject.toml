[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditrail"
version = "0.1.0"
description = "Tamper-evident audit trails and a lethal-trifecta policy guard for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "auditrail contributors" }]
keywords = ["ai-agents", "audit", "security", "mcp", "prompt-injection", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/x91652-pixel/auditrail"
Issues = "https://github.com/x91652-pixel/auditrail/issues"

[project.scripts]
auditrail = "auditrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
