[package]
name = "auditrail-dashboard"
version = "0.1.0"
edition = "2021"
description = "Web dashboard for auditrail: evidence log viewer, integrity verification, policy viewer."
license = "Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
