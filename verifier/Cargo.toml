[package]
name = "auditrail-verify"
version = "0.3.1"
edition = "2021"
description = "Independent offline verifier for auditrail evidence ledgers (format v2). Does not call or import the Python implementation."
license = "Apache-2.0"

[dependencies]
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true

# Tests are compiled with optimisations (the robust tests took ~4.6 minutes unoptimised). Overflow checks and
# debug_assert! stay ON in the test profile, so the same assertions run; only the speed changes.
[profile.test]
opt-level = 3
