name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard
      - run: cargo test --locked
      - run: cargo build --release

  verifier:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verifier
      # Python and Rust must agree on every conformance vector, and the vectors must be reproducible.
      - run: pip install -e ".[dev]"
      - run: python docs/spec/vectors/generate.py
      - run: git diff --exit-code -- docs/spec/vectors
      - run: cargo test
        working-directory: verifier
      - run: cargo build --release
        working-directory: verifier
      - run: pytest tests/test_vectors.py tests/test_rust_verifier.py tests/test_reader_agreement.py -v
      # property-based differential testing: Python vs Rust on mutated and garbage input
      - run: pytest tests/test_fuzz.py -v
        env:
          AUDITRAIL_FUZZ_EXAMPLES: "250"
